name: Kube-Guardrail-MCP CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.13"]
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.matrix.python-version }}
        cache: "pip"
        cache-dependency-path: |
          **/pyproject.toml
          **/requirements.txt
          
    - name: Configure Git Identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
    - name: Security-Validated Dependency Installation
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install --upgrade setuptools wheel --no-cache-dir
        pip install --no-cache-dir \
          ruff==0.9.0 \
          mypy==1.14.0 \
          pytest==8.3.0 \
          pytest-asyncio==0.25.0 \
          pydantic==2.10.0 \
          pydantic-settings==2.7.0 \
          lancedb==0.17.0 \
          fastembed==0.5.1 \
          kubernetes-asyncio==32.0.0 \
          opentelemetry-api==1.30.0 \
          opentelemetry-sdk==1.30.0 \
          cryptography==44.0.0
        if [ -f requirements.txt ]; then
          pip install --no-cache-dir -r requirements.txt
        fi
        
    - name: Execute Ruff Linter Security Validation
      run: |
        cat > ruff.toml << EOF
        target-version = "py313"
        line-length = 100
        
        [lint]
        select = [
          "E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH"
        ]
        ignore = []
        
        [lint.isort]
        known-first-party = ["ai_sre"]
        EOF
        
        ruff check src/ai_sre tests --output-format=github
        
    - name: Perform Mypy Static Type Analysis
      run: |
        cat > mypy.ini << EOF
        [mypy]
        python_version = "3.13"
        strict = true
        warn_return_any = true
        warn_unused_configs = true
        disallow_untyped_defs = true
        disallow_incomplete_defs = true
        check_untyped_defs = true
        disallow_untyped_decorators = true
        no_implicit_optional = true
        warn_redundant_casts = true
        warn_unused_ignores = true
        warn_no_return = true
        warn_unreachable = true
        show_error_codes = true
        pretty = true
        
        [mypy-ai_sre.*]
        ignore_missing_imports = true
        EOF
        
        mypy src/ai_sre tests --config-file=mypy.ini
        
    - name: Execute Comprehensive Test Suite
      run: |
        export AI_SRE_DB_PATH="./data/lancedb"
        export AI_SRE_AUDIT_LOG_PATH="./data/audit/audit.jsonl"
        export AI_SRE_GATE_SECRET="test-secret-key-32chars"
        export AI_SRE_SALT="test-salt-key-32chars"
        mkdir -p data/lancedb data/audit
        pytest tests/ -v --tb=short --cov=src/ai_sre --cov-report=xml --cov-report=html
